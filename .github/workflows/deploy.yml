name: Build audio and publish app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts

      - name: Restore voice cache
        uses: actions/cache@v4
        with:
          path: .tts-cache
          key: tts-${{ hashFiles('data/themes.json', 'scripts/build_audio.py') }}
          restore-keys: tts-

      - name: Build 30-minute practice tracks
        run: python scripts/build_audio.py

      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest icon-*.png data audio _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
